{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload Papers - Prediksi Referensi</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 py-10">
  <div class="max-w-xl mx-auto bg-white p-6 rounded shadow">
    <h1 class="text-2xl font-bold mb-4 text-center">Upload Dua Paper</h1>
    <form method="post" enctype="multipart/form-data" class="space-y-4">
      {% csrf_token %}
      <!-- Field untuk Paper 1 -->
      <div>
        <label for="id_paper1" class="block font-medium text-gray-700 mb-1">Paper 1:</label>
        <input type="file" name="paper1" id="id_paper1" required
               class="block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer focus:outline-none focus:border-blue-500" />
      </div>
      <!-- Field untuk Paper 2 -->
      <div>
        <label for="id_paper2" class="block font-medium text-gray-700 mb-1">Paper 2:</label>
        <input type="file" name="paper2" id="id_paper2" required
               class="block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer focus:outline-none focus:border-blue-500" />
      </div>
      <!-- Tombol Submit -->
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded">
        Prediksi Apakah Mereferensi
      </button>
    </form>
  </div>
</body>
</html>
